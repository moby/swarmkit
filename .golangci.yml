version: "2"

run:
  tests: false
  timeout: 10m

linters: 
  default: none
  enable:
    - errorlint
    - ginkgolinter
    - govet
    - ineffassign
    - misspell
    - modernize
    - revive
    - unconvert
    - unused
  settings:
    govet:
      enable:
        - nilness
    revive:
      enable-all-rules: false
      enable-default-rules: true
      max-open-files: 2048
      rules:
        - name: errorf
        - name: unnecessary-format
        - name: use-errors-new
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        text: stutters
      - linters:
          - revive
        text: redefines-builtin-id
    paths:
      - .*\.pb\.go$
    warn-unused: true

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    warn-unused: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
