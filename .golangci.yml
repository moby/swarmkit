version: "2"

run:
  tests: false
  timeout: 10m

linters: 
  default: none
  enable:
    - misspell
    - ineffassign
    - revive
    - unconvert
    - unused
    - govet
  settings:
    govet:
      enable:
        - nilness
      disable:
        # google.golang.org/protobuf messages embed protoimpl.MessageState
        # (which contains a sync.Mutex), so copylocks fires wherever a proto
        # message is passed or ranged over by value. SwarmKit's APIs do this
        # in many places (e.g. the Remotes/Proposer interfaces, state.Change).
        # Pointerizing all of them is a large, separate refactor; until then
        # copylocks is disabled to avoid a wall of false-positive-ish findings.
        - copylocks
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        text: stutters
      - linters:
          - revive
        text: empty-block
      - linters:
          - revive
        text: superfluous-else
      - linters:
          - revive
        text: unused-parameter
      - linters:
          - revive
        text: redefines-builtin-id
      - linters:
          - revive
        text: if-return
    paths:
      - .*\.pb\.go$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
