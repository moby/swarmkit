version: "2"

run:
  tests: false
  timeout: 10m

linters: 
  default: none
  enable:
    - ginkgolinter
    - govet
    - ineffassign
    - misspell
    - modernize
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    govet:
      enable:
        - nilness
    staticcheck:
      checks:
        - all
        - -QF1008
        - -QF1010
        - -QF1011
        - -S1032
        - -S1039
        - -SA1019
        - -SA1029
        - -SA2001
        - -SA4005
        - -SA4006
        - -SA4010
        - -ST1005
        - -ST1016
        - -ST1023
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        text: stutters
      - linters:
          - revive
        text: empty-block
      - linters:
          - revive
        text: superfluous-else
      - linters:
          - revive
        text: unused-parameter
      - linters:
          - revive
        text: redefines-builtin-id
      - linters:
          - revive
        text: if-return
    paths:
      - .*\.pb\.go$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
