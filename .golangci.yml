version: "2"

run:
  tests: false
  timeout: 10m

linters: 
  default: none
  enable:
    - ginkgolinter
    - govet
    - ineffassign
    - misspell
    - modernize
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    govet:
      enable:
        - nilness
    staticcheck:
      checks:
        - all
        - -QF1008 # Omit embedded fields from selector expression; https://staticcheck.dev/docs/checks/#QF1008
        - -QF1010 # FIXME: Convert slice of bytes to string when printing it; https://staticcheck.dev/docs/checks/#QF1010
        - -QF1011 # FIXME: Omit redundant type from variable declaration; https://staticcheck.dev/docs/checks/#QF1011
        - -SA1019 # FIXME: Using a deprecated function, variable, constant or field; https://staticcheck.dev/docs/checks/#SA1019
        - -SA1029 # FIXME: Inappropriate key in call to context.WithValue; https://staticcheck.dev/docs/checks/#SA1029
        - -SA2001 # FIXME: Empty critical section; https://staticcheck.dev/docs/checks/#SA2001
        - -SA4005 # FIXME: Field assignment that will never be observed; https://staticcheck.dev/docs/checks/#SA4005
        - -SA4006 # FIXME: A value assigned to a variable is never read before being overwritten; https://staticcheck.dev/docs/checks/#SA4006
        - -SA4010 # FIXME: The result of append will never be observed anywhere; https://staticcheck.dev/docs/checks/#SA4010
        - -ST1005 # Incorrectly formatted error string; https://staticcheck.dev/docs/checks/#ST1005
        - -ST1016 # FIXME: Use consistent method receiver names; https://staticcheck.dev/docs/checks/#ST1016
        - -ST1023 # FIXME: Redundant type in variable declaration; https://staticcheck.dev/docs/checks/#ST1023
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        text: stutters
      - linters:
          - revive
        text: empty-block
      - linters:
          - revive
        text: superfluous-else
      - linters:
          - revive
        text: unused-parameter
      - linters:
          - revive
        text: redefines-builtin-id
      - linters:
          - revive
        text: if-return
    paths:
      - .*\.pb\.go$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
