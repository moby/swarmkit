// Stub gogo.proto that satisfies transitive imports without requiring the gogo
// runtime. All options are defined as no-ops for protoc compilation purposes.
syntax = "proto2";

package gogoproto;

option go_package = "github.com/gogo/protobuf/gogoproto";

import "google/protobuf/descriptor.proto";

